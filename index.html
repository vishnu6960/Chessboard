<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bearings — Find your bearings in life, work &amp; money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --navy:#12233B;
    --navy-2:#1B3358;
    --navy-3:#233F66;
    --brass:#C08B2C;
    --brass-light:#E3B85E;
    --sea:#2F6F5E;
    --sea-light:#E4F0EC;
    --coral:#B23A48;
    --coral-light:#F6E6E7;
    --cream:#F6F3EC;
    --paper:#FCFBF8;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --line:#E4DFD3;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--brass-light);color:var(--navy);}

  /* ---------- Top Nav ----------- */
  .topnav{
    position:sticky;top:0;z-index:50;
    background:var(--navy);
    color:#fff;
    border-bottom:3px solid var(--brass);
  }
  .topnav-inner{
    max-width:1440px;margin:0 auto;
    display:flex;align-items:center;gap:18px;
    padding:0 20px;height:64px;
  }
  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .brand-mark{width:30px;height:30px;flex-shrink:0;}
  .brand-name{
    font-family:'Fraunces',serif;font-weight:600;font-size:20px;
    letter-spacing:-0.01em;
  }
  .brand-tag{
    font-size:10.5px;color:var(--brass-light);
    text-transform:uppercase;letter-spacing:0.14em;
    margin-top:1px;display:block;font-family:'Inter',sans-serif;font-weight:600;
  }
  .nav-search{
    flex:1;max-width:420px;
    display:flex;align-items:center;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:8px;padding:0 12px;height:38px;
  }
  .nav-search input{
    background:transparent;border:none;outline:none;color:#fff;
    font-size:14px;width:100%;padding-left:8px;font-family:'Inter',sans-serif;
  }
  .nav-search input::placeholder{color:rgba(255,255,255,0.5);}
  .nav-search svg{flex-shrink:0;opacity:0.6;}
  .nav-links{display:flex;gap:4px;margin-left:auto;flex-shrink:0;}
  .nav-links button{
    background:none;border:none;color:rgba(255,255,255,0.82);
    font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:6px;
    transition:background .15s, color .15s;
  }
  .nav-links button:hover{background:rgba(255,255,255,0.1);color:#fff;}
  .nav-links button.active{background:var(--brass);color:var(--navy);}
  .hamburger{
    display:none;background:none;border:1px solid rgba(255,255,255,0.25);
    border-radius:6px;padding:7px 9px;color:#fff;
  }

  /* ---------- Shell layout ---------- */
  .shell{
    max-width:1440px;margin:0 auto;
    display:grid;
    grid-template-columns:250px minmax(0,1fr) 260px;
    gap:0;
    align-items:start;
  }
  .col-left{
    position:sticky;top:64px;
    height:calc(100vh - 64px);
    overflow-y:auto;
    border-right:1px solid var(--line);
    background:var(--paper);
    padding:18px 0 40px;
  }
  .col-main{
    min-width:0;
    padding:28px 34px 80px;
    border-right:1px solid var(--line);
    background:var(--cream);
  }
  .col-right{
    position:sticky;top:64px;
    height:calc(100vh - 64px);
    overflow-y:auto;
    padding:20px 16px 40px;
  }

  /* ---------- Left sidebar ---------- */
  .side-search{
    display:none;
    margin:0 16px 14px;
  }
  .cat-block{margin-bottom:4px;}
  .cat-head{
    width:100%;display:flex;align-items:center;gap:10px;
    background:none;border:none;text-align:left;
    padding:10px 16px;font-size:13px;font-weight:700;
    color:var(--navy);text-transform:uppercase;letter-spacing:0.05em;
  }
  .cat-bearing{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;
    color:var(--brass);background:#FBF1DD;border:1px solid #EBD6A4;
    padding:2px 6px;border-radius:20px;flex-shrink:0;
  }
  .cat-chevron{margin-left:auto;color:var(--ink-soft);transition:transform .15s;}
  .cat-chevron.open{transform:rotate(90deg);}
  .topic-list{list-style:none;margin:0;padding:0 8px 10px 8px;}
  .topic-item button{
    width:100%;text-align:left;background:none;border:none;
    padding:8px 12px 8px 30px;font-size:13.5px;color:var(--ink-soft);
    border-radius:6px;border-left:2px solid transparent;
    line-height:1.35;
  }
  .topic-item button:hover{background:var(--sea-light);color:var(--navy);}
  .topic-item button.active{
    background:var(--navy);color:#fff;font-weight:600;
    border-left:2px solid var(--brass);
  }
  .side-divider{height:1px;background:var(--line);margin:8px 16px;}
  .home-link{
    display:block;margin:0 16px 14px;padding:9px 12px;
    background:var(--navy);color:#fff;border-radius:8px;
    font-size:13px;font-weight:700;text-align:center;
    text-transform:uppercase;letter-spacing:0.04em;
  }

  /* ---------- Right rail (ads) ---------- */
  .ad-slot{
    border:1.5px dashed #C9C2AE;
    border-radius:var(--radius);
    background:repeating-linear-gradient(135deg,#F1EDE1,#F1EDE1 10px,#EDE8D9 10px,#EDE8D9 20px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:#9C9482;padding:22px 14px;margin-bottom:16px;
  }
  .ad-slot .ad-label{
    font-size:10px;text-transform:uppercase;letter-spacing:0.14em;
    font-weight:700;color:#A79A73;margin-bottom:6px;
  }
  .ad-slot .ad-size{font-size:11.5px;color:#B0A78C;}
  .rail-note{
    font-size:12px;color:var(--ink-soft);line-height:1.6;
    background:var(--paper);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px;margin-bottom:16px;
  }
  .rail-note b{color:var(--navy);}

  /* ---------- Main content ---------- */
  .crumb{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .crumb b{color:var(--navy);}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;
    color:var(--brass);text-transform:uppercase;letter-spacing:0.12em;
    margin-bottom:10px;
  }
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--brass);}
  .page-title{font-size:34px;font-weight:600;color:var(--navy);margin:0 0 12px;line-height:1.15;}
  .page-summary{font-size:16.5px;color:var(--ink-soft);line-height:1.65;max-width:760px;margin:0 0 26px;}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:30px;}
  .stat-card{
    flex:1;min-width:150px;
    background:var(--navy);color:#fff;border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-card .val{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--brass-light);}
  .stat-card .lbl{font-size:12px;color:rgba(255,255,255,0.72);margin-top:4px;line-height:1.4;}

  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:30px;}
  .dd-card{border-radius:var(--radius);padding:18px 20px;}
  .dd-card.do{background:var(--sea-light);border:1px solid #C9E1D6;}
  .dd-card.dont{background:var(--coral-light);border:1px solid #E9C7CB;}
  .dd-title{
    font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;
    margin-bottom:10px;display:flex;align-items:center;gap:7px;
  }
  .dd-card.do .dd-title{color:var(--sea);}
  .dd-card.dont .dd-title{color:var(--coral);}
  .dd-card ul{margin:0;padding:0;list-style:none;}
  .dd-card li{
    font-size:13.8px;line-height:1.55;padding:6px 0 6px 20px;position:relative;color:var(--ink);
  }
  .dd-card.do li:before{content:"✓";position:absolute;left:0;color:var(--sea);font-weight:700;}
  .dd-card.dont li:before{content:"✕";position:absolute;left:0;color:var(--coral);font-weight:700;}

  .body-copy{max-width:760px;margin-bottom:6px;}
  .body-copy h3{font-size:19px;color:var(--navy);margin:26px 0 10px;font-weight:600;}
  .body-copy p{font-size:15px;line-height:1.75;color:#333B47;margin:0 0 14px;}

  .disclaimer{
    max-width:760px;font-size:12px;color:var(--ink-soft);
    border-left:3px solid var(--brass);padding:8px 0 8px 14px;margin:20px 0 34px;
    background:#FBF7EC;line-height:1.6;
  }

  /* ---------- Calculator ---------- */
  .calc-wrap{
    max-width:760px;
    background:var(--navy);border-radius:14px;padding:26px 28px 28px;
    margin:10px 0 36px;color:#fff;
  }
  .calc-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .calc-head .ico{
    width:30px;height:30px;border-radius:8px;background:var(--brass);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--navy);
  }
  .calc-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
  .calc-sub{font-size:12.5px;color:rgba(255,255,255,0.6);margin:2px 0 20px;}
  .calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin-bottom:22px;}
  .calc-field label{
    display:flex;justify-content:space-between;
    font-size:12px;color:rgba(255,255,255,0.75);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:0.05em;font-weight:600;
  }
  .calc-field label span.v{color:var(--brass-light);font-family:'JetBrains Mono',monospace;}
  .calc-field input[type=range]{
    width:100%;accent-color:var(--brass);
  }
  .calc-field input[type=number]{
    width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);
    border-radius:6px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:14px;
    padding:8px 10px;outline:none;
  }
  .calc-results{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    border-top:1px solid rgba(255,255,255,0.15);padding-top:20px;
  }
  .calc-result{background:rgba(255,255,255,0.06);border-radius:8px;padding:14px 14px;}
  .calc-result .rv{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--brass-light);}
  .calc-result .rl{font-size:11px;color:rgba(255,255,255,0.65);margin-top:4px;text-transform:uppercase;letter-spacing:0.05em;}
  .calc-note{font-size:11.5px;color:rgba(255,255,255,0.5);margin-top:16px;line-height:1.55;}

  /* ---------- Homepage ---------- */
  .hero{
    background:linear-gradient(135deg,var(--navy),var(--navy-2) 60%, var(--navy-3));
    border-radius:16px;padding:44px 40px;color:#fff;margin-bottom:34px;position:relative;overflow:hidden;
  }
  .hero:before{
    content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;
    border:1.5px solid rgba(224,184,94,0.25);border-radius:50%;
  }
  .hero:after{
    content:"";position:absolute;right:-10px;top:-10px;width:140px;height:140px;
    border:1.5px solid rgba(224,184,94,0.3);border-radius:50%;
  }
  .hero h1{font-size:36px;line-height:1.18;max-width:600px;font-weight:600;margin:0 0 14px;}
  .hero p{font-size:15.5px;color:rgba(255,255,255,0.75);max-width:520px;line-height:1.65;margin:0 0 22px;}
  .hero-badges{display:flex;gap:10px;flex-wrap:wrap;}
  .hero-badge{
    font-size:12px;font-weight:600;background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.18);padding:6px 12px;border-radius:20px;
  }
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:10px;}
  .cat-card{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:20px 22px;transition:border-color .15s, transform .15s;cursor:pointer;
  }
  .cat-card:hover{border-color:var(--brass);transform:translateY(-2px);}
  .cat-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cat-card-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--navy);}
  .cat-card-desc{font-size:13px;color:var(--ink-soft);line-height:1.55;margin-bottom:10px;}
  .cat-card-count{font-size:11.5px;color:var(--brass);font-weight:700;text-transform:uppercase;letter-spacing:0.05em;}

  footer{
    grid-column:1 / -1;
    background:var(--navy);color:rgba(255,255,255,0.6);
    text-align:center;padding:26px 20px;font-size:12px;line-height:1.7;
  }
  footer b{color:#fff;}

  @media (max-width:980px){
    .shell{grid-template-columns:1fr;}
    .col-right{display:none;}
    .col-left{
      position:fixed;left:0;top:64px;width:270px;z-index:40;
      transform:translateX(-100%);transition:transform .2s ease;
      box-shadow:2px 0 16px rgba(0,0,0,0.15);
    }
    .col-left.open{transform:translateX(0);}
    .hamburger{display:inline-flex;}
    .nav-search{display:none;}
    .side-search{display:block;}
    .dodont{grid-template-columns:1fr;}
    .calc-grid{grid-template-columns:1fr;}
    .calc-results{grid-template-columns:1fr;}
    .cat-grid{grid-template-columns:1fr;}
    .col-main{padding:22px 18px 60px;}
    .page-title{font-size:27px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useMemo, useEffect} = React;

/* ============================ DATA ============================ */

const CATEGORIES = [
  {
    id: "career",
    label: "Career & Work",
    bearing: "090",
    desc: "Building, growing and steering a working life you don't dread.",
  },
  {
    id: "invest",
    label: "Money & Investing",
    bearing: "045",
    desc: "How money grows, and the guardrails to keep around it.",
  },
  {
    id: "finance",
    label: "Personal Finance",
    bearing: "180",
    desc: "The plumbing of everyday money — budgets, buffers, debt.",
  },
  {
    id: "life",
    label: "Life Skills",
    bearing: "315",
    desc: "The unglamorous habits that quietly decide most outcomes.",
  },
];

const TOPICS = [
  // ---------------- CAREER ----------------
  {
    id: "career-foundation",
    cat: "career",
    title: "Building a Career Foundation",
    summary: "Early career decisions compound the same way money does — the direction matters more than the speed.",
    stats: [
      {v:"3-5 yrs", l:"Typical time to build real depth in a domain"},
      {v:"70%", l:"Of jobs found through networks, not applications alone"},
      {v:"2x", l:"Career switchers who plan the move outperform impulsive switchers"},
    ],
    dos: [
      "Pick a direction and go deep before you go wide — depth is what gets you hired.",
      "Ask for feedback on your work every few months, not once a year at review time.",
      "Keep a running record of your wins — you will need it, and memory is unreliable.",
      "Build one visible skill outside your job description; it becomes your differentiator.",
    ],
    donts: [
      "Don't chase titles over skills — titles without substance stall out fast.",
      "Don't stay silent about your ambitions; managers can't read minds.",
      "Don't switch direction every year chasing trends — shallow experience compounds poorly.",
      "Don't wait for permission to learn something — most growth is self-assigned.",
    ],
    body: [
      {h:"Direction before speed", p:"Most early-career anxiety comes from comparing your speed to someone else's, on a road you never chose. A slower path in the right direction beats a fast sprint in the wrong one — because skill and reputation compound, and compounding needs time in one place before it needs more effort."},
      {h:"The two things that actually get noticed", p:"Consistently reliable output, and being easy to work with. Neither is glamorous. Both are rarer than people assume, and both are entirely within your control regardless of the industry."},
    ],
  },
  {
    id: "career-negotiation",
    cat: "career",
    title: "Negotiating Pay & Offers",
    summary: "A single negotiated raise, repeated as a percentage every year after, becomes a very different number by retirement — the calculator below shows why.",
    stats: [
      {v:"~5-10%", l:"Typical room available on most initial offers"},
      {v:"1 in 3", l:"Candidates who never negotiate at all"},
    ],
    dos: [
      "Let the employer name a number first whenever you can.",
      "Negotiate the whole package — base, bonus, start date, review timing — not just salary.",
      "Get any verbal offer changes confirmed in writing.",
      "Practice saying the number out loud before the actual conversation.",
    ],
    donts: [
      "Don't justify your ask with personal expenses — anchor it to market value and impact instead.",
      "Don't accept on the spot — 24-48 hours to 'review' is a completely normal ask.",
      "Don't negotiate over text or email if a short call is possible — tone gets lost in writing.",
      "Don't burn the relationship over the last 2-3% — know when a deal is good enough.",
    ],
    body: [
      {h:"Why the first number matters so much", p:"An offer isn't usually a company's ceiling — it's a starting bid. Because future raises are typically a percentage of current pay, a gap created on day one tends to persist, and often widens, for years afterward."},
    ],
    calculator: "salary",
  },
  {
    id: "career-skills",
    cat: "career",
    title: "Continuous Skill Development",
    summary: "Skills depreciate quietly. The people who stay valuable are the ones who treat learning as maintenance, not an event.",
    stats: [
      {v:"~5 yrs", l:"Rough half-life of a purely technical skill in fast-moving fields"},
      {v:"1 hr/day", l:"A commonly cited baseline for deliberate skill-building"},
    ],
    dos: [
      "Pick skills adjacent to what you already do well — leverage compounds faster than novelty.",
      "Learn in public where possible; teaching a thing is the fastest way to actually know it.",
      "Revisit fundamentals occasionally — they erode faster than people expect.",
      "Pair every new skill with a small real project, not just theory.",
    ],
    donts: [
      "Don't collect certificates as a substitute for applied practice.",
      "Don't learn only what's comfortable — the useful stuff is often slightly uncomfortable.",
      "Don't ignore 'soft' skills like writing and communication — they multiply everything else.",
    ],
    body: [
      {h:"Maintenance, not a sprint", p:"Skill decay is normal, not a personal failing. Treating learning as a recurring habit — even a small one — avoids the much harder problem of trying to catch up all at once after years of drift."},
    ],
  },

  // ---------------- INVEST ----------------
  {
    id: "invest-basics",
    cat: "invest",
    title: "Why Investing Beats Saving Alone",
    summary: "Cash sitting still quietly loses value to inflation. Investing is simply asking money to do work instead of waiting.",
    stats: [
      {v:"~6-10%", l:"Illustrative long-run annual range for broad diversified equity markets, before inflation"},
      {v:"~2-6%", l:"Illustrative long-run inflation range, which savings alone rarely outpaces"},
    ],
    dos: [
      "Start with whatever amount is comfortable — consistency matters more than size at the start.",
      "Understand what you're invested in before you invest in it.",
      "Automate contributions so the decision only has to be made once.",
      "Give growth-oriented investments real time — years, not months, to work.",
    ],
    donts: [
      "Don't invest money you'll need within the next 1-2 years.",
      "Don't chase last year's best-performing option — past results don't repeat on command.",
      "Don't check balances daily — it invites reactive, costly decisions.",
      "Don't treat any single figure in this section as a promise — markets fluctuate and can lose value too.",
    ],
    body: [
      {h:"The quiet cost of doing nothing", p:"Money that isn't invested doesn't stay still — it slowly loses purchasing power to rising prices. Investing doesn't remove risk; it exchanges the certain, slow risk of inflation for a different, more manageable one."},
      {h:"Time is the actual engine", p:"The figures people find impressive about long-term investing rarely come from picking well. They come from starting early and staying invested through the ordinary ups and downs. The calculator below shows how contribution size and time trade off against each other."},
    ],
    calculator: "compound",
  },
  {
    id: "invest-diversify",
    cat: "invest",
    title: "Diversification, in Plain Terms",
    summary: "Not a guarantee against loss — a way of making sure one bad decision can't be a fatal one.",
    stats: [
      {v:"1 idea", l:"What a single stock or asset really is — a bet on one story"},
      {v:"Many", l:"The number of unrelated 'stories' a diversified portfolio holds at once"},
    ],
    dos: [
      "Spread exposure across different asset types, industries, and geographies.",
      "Rebalance occasionally so no single winner quietly becomes your whole portfolio.",
      "Match your mix of investments to your actual timeline, not your mood that week.",
      "Treat broad, low-cost diversified options as a sensible default, not the exciting choice.",
    ],
    donts: [
      "Don't mistake owning many things in the same industry for real diversification.",
      "Don't put a large share of savings into any single opportunity, however good it looks.",
      "Don't confuse diversification with an absence of risk — it manages risk, it doesn't erase it.",
    ],
    body: [
      {h:"Why concentration feels good until it doesn't", p:"A concentrated bet that works looks like genius in hindsight. The problem is survivorship — for every concentrated bet that worked, others didn't, and diversification is the discipline of not needing to know in advance which one you hold."},
    ],
  },
  {
    id: "invest-horizon",

const fmtMoney = (n) => {
  if (!isFinite(n)) return "—";
  return "$" + Math.round(n).toLocaleString("en-US");
};

/* ============================ CALCULATORS ============================ */

function CompoundCalculator(){
  const [principal, setPrincipal] = useState(2000);
  const [monthly, setMonthly] = useState(200);
  const [rate, setRate] = useState(7);
  const [years, setYears] = useState(15);

  const {future, contributed, growth} = useMemo(() => {
    const r = rate/100/12;
    const n = years*12;
    const fv = r > 0
      ? principal*Math.pow(1+r, n) + monthly*((Math.pow(1+r, n)-1)/r)
      : principal + monthly*n;
    const contributed = principal + monthly*n;
    return {future: fv, contributed, growth: fv - contributed};
  }, [principal, monthly, rate, years]);

  return (
    <div className="calc-wrap">
      <div className="calc-head">
        <div className="ico"><IconCalc/></div>
        <div>
          <div className="calc-title">Compound Growth Calculator</div>
        </div>
      </div>
      <div className="calc-sub">See how a starting amount plus regular contributions could grow over time at an assumed rate.</div>
      <div className="calc-grid">
        <div className="calc-field">
          <label>Starting amount <span className="v">{fmtMoney(principal)}</span></label>
          <input type="range" min="0" max="50000" step="100" value={principal} onChange={e=>setPrincipal(+e.target.value)} />
        </div>
        <div className="calc-field">
          <label>Monthly contribution <span className="v">{fmtMoney(monthly)}</span></label>
          <input type="range" min="0" max="3000" step="10" value={monthly} onChange={e=>setMonthly(+e.target.value)} />
        </div>
        <div className="calc-field">
          <label>Assumed annual rate <span className="v">{rate}%</span></label>
          <input type="range" min="0" max="15" step="0.5" value={rate} onChange={e=>setRate(+e.target.value)} />
        </div>
        <div className="calc-field">
          <label>Time horizon <span className="v">{years} yrs</span></label>
          <input type="range" min="1" max="40" step="1" value={years} onChange={e=>setYears(+e.target.value)} />
        </div>
      </div>
      <div className="calc-results">
        <div className="calc-result"><div className="rv">{fmtMoney(future)}</div><div className="rl">Projected value</div></div>
        <div className="calc-result"><div className="rv">{fmtMoney(contributed)}</div><div className="rl">You contributed</div></div>
        <div className="calc-result"><div className="rv">{fmtMoney(growth)}</div><div className="rl">Growth earned</div></div>
      </div>
      <div className="calc-note">Illustrative only — a fixed rate is assumed for simplicity, but real markets fluctuate year to year and can lose value. This is not investment advice or a projection of any specific product's performance.</div>
    </div>
  );
}

function EmergencyFundCalculator(){
  const [expenses, setExpenses] = useState(1800);
  const [months, setMonths] = useState(4);
  const [current, setCurrent] = useState(500);
  const [monthlySave, setMonthlySave] = useState(150);

  const {target, gap, monthsToGoal} = useMemo(() => {
    const target = expenses*months;
    const gap = Math.max(target-current, 0);
    const monthsToGoal = monthlySave>0 ? Math.ceil(gap/monthlySave) : Infinity;
    return {target, gap, monthsToGoal};
  }, [expenses, months, current, monthlySave]);

  return (
    <div className="calc-wrap">
      <div className="calc-head">
        <div className="ico"><IconCalc/></div>
        <div className="calc-title">Emergency Fund Calculator</div>
      </div>
      <div className="calc-sub">Work out your target buffer and how long it will take to reach it.</div>
      <div className="calc-grid">
        <div className="calc-field">
          <label>Essential monthly expenses <span className="v">{fmtMoney(expenses)}</span></label>
          <input type="range" min="200" max="6000" step="50" value={expenses} onChange={e=>setExpenses(+e.target.value)} />
        </div>
        <div className="calc-field">
          <label>Months of cover wanted <span className="v">{months} mo</span></label>
          <input type="range" min="1" max="12" step="1" value={months} onChange={e=>setMonths(+e.target.value)} />
        </div>
        <div className="calc-field">
          <label>Currently saved <span className="v">{fmtMoney(current)}</span></label>
          <input type="range" min="0" max="20000" step="50" value={current} onChange={e=>setCurrent(+e.target.value)} />
        </div>
        <div className="calc-field">
          <label>Can save per month <span className="v">{fmtMoney(monthlySave)}</span></label>
          <input type="range" min="0" max="2000" step="10" value={monthlySave} onChange={e=>setMonthlySave(+e.target.value)} />
        </div>
      </div>
      <div className="calc-results">
        <div className="calc-result"><div className="rv">{fmtMoney(target)}</div><div className="rl">Target buffer</div></div>
        <div className="calc-result"><div className="rv">{fmtMoney(gap)}</div><div className="rl">Still needed</div></div>
        <div className="calc-result"><div className="rv">{isFinite(monthsToGoal) ? monthsToGoal+" mo" : "—"}</div><div className="rl">Time to reach it</div></div>
      </div>
      <div className="calc-note">A commonly cited starting range is 3-6 months of essential expenses — adjust to fit your own job stability and dependents.</div>
    </div>
  );
}

function BudgetCalculator(){

function SalaryCalculator(){
  const [current, setCurrent] = useState(60000);
  const [negotiated, setNegotiated] = useState(5);
  const [growth, setGrowth] = useState(4);
  const [years, setYears] = useState(10);

  const {withNeg, withoutNeg, diff} = useMemo(() => {
    const base = current;
    const negStart = current*(1+negotiated/100);
    let a = negStart, b = base, sumA=0, sumB=0;
    for(let i=0;i<years;i++){
      sumA += a; sumB += b;
      a *= (1+growth/100); b *= (1+growth/100);
    }
    return {withNeg: sumA, withoutNeg: sumB, diff: sumA-sumB};
  }, [current, negotiated, growth, years]);

  return (
    <div className="calc-wrap">
      <div className="calc-head">
        <div className="ico"><IconCalc/></div>
        <div className="calc-title">Salary Negotiation Calculator</div>
      </div>
      <div className="calc-sub">See the cumulative effect of negotiating your starting offer, assuming similar % raises either way.</div>
      <div className="calc-grid">
        <div className="calc-field">
          <label>Current offer <span className="v">{fmtMoney(current)}</span></label>
          <input type="range" min="20000" max="250000" step="1000" value={current} onChange={e=>setCurrent(+e.target.value)} />
        </div>
        <div className="calc-field">
          <label>Negotiated bump <span className="v">{negotiated}%</span></label>
          <input type="range" min="0" max="20" step="1" value={negotiated} onChange={e=>setNegotiated(+e.target.value)} />
        </div>
        <div className="calc-field">
          <label>Assumed annual raise <span className="v">{growth}%</span></label>
          <input type="range" min="0" max="10" step="0.5" value={growth} onChange={e=>setGrowth(+e.target.value)} />
        </div>
        <div className="calc-field">
          <label>Years to project <span className="v">{years} yrs</span></label>
          <input type="range" min="1" max="30" step="1" value={years} onChange={e=>setYears(+e.target.value)} />
        </div>
      </div>
      <div className="calc-results">
        <div className="calc-result"><div className="rv">{fmtMoney(withNeg)}</div><div className="rl">Cumulative, negotiated</div></div>
        <div className="calc-result"><div className="rv">{fmtMoney(withoutNeg)}</div><div className="rl">Cumulative, as offered</div></div>
        <div className="calc-result"><div className="rv">{fmtMoney(diff)}</div><div className="rl">Difference over {years} yrs</div></div>
      </div>
      <div className="calc-note">Illustrative — real raises are rarely a flat percentage every year, but the compounding effect of a higher starting point is directionally real.</div>
    </div>
  );
}

function Calculator({type}){
  if(type==="compound") return <CompoundCalculator/>;
  if(type==="emergency") return <EmergencyFundCalculator/>;
  if(type==="budget") return <BudgetCalculator/>;
  if(type==="salary") return <SalaryCalculator/>;
  return null;
}

      <div className="hero">
        <div className="eyebrow" style={{color:"var(--brass-light)"}}><span className="dot" style={{background:"var(--brass-light)"}}></span>No logins. No cost. No noise.</div>
        <h1>Get your bearings on career, money, and everyday life.</h1>
        <p>Plain-language guidance on the decisions that quietly shape a life — what tends to work, what tends to backfire, and a few calculators to make the numbers concrete without ever leaving the page.</p>
        <div className="hero-badges">
          <span className="hero-badge">🧭 {TOPICS.length} topics</span>
          <span className="hero-badge">🧮 4 built-in calculators</span>
          <span className="hero-badge">🔓 Always free</span>
        </div>
      </div>

      <h2 style={{fontSize:20,color:"var(--navy)",marginBottom:14}}>Choose a heading</h2>
      <div className="cat-grid">
        {CATEGORIES.map(cat=>(
          <div className="cat-card" key={cat.id} onClick={()=>onSelectCategory(cat)}>
            <div className="cat-card-top">
              <span className="cat-card-title">{cat.label}</span>
              <span className="cat-bearing">{cat.bearing}°</span>
            </div>
            <div className="cat-card-desc">{cat.desc}</div>
            <div className="cat-card-count">{TOPICS.filter(t=>t.cat===cat.id).length} topics →</div>
          </div>
        ))}
      </div>
    </main>
  );
}

/* ============================ APP ============================ */

function App(){
  const [activeTopic, setActiveTopic] = useState(null);
  const [query, setQuery] = useState("");
  const [mobileOpen, setMobileOpen] = useState(false);

  const selectTopic = (t) => { setActiveTopic(t); setMobileOpen(false); };
  const goHome = () => { setActiveTopic(null); setMobileOpen(false); };
  const selectCategory = (cat) => {
    const first = TOPICS.find(t=>t.cat===cat.id);
    if(first) setActiveTopic(first);
  };

  return (
    <React.Fragment>
      <nav className="topnav">
        <div className="topnav-inner">
          <button className="hamburger" onClick={()=>setMobileOpen(o=>!o)}><IconMenu/></button>
          <a className="brand" href="#" onClick={(e)=>{e.preventDefault();goHome();}}>
            <span className="brand-mark"><CompassMark/></span>
            <span>
              <span className="brand-name">Bearings</span>
              <span className="brand-tag">Life · Career · Money</span>
            </span>
          </a>
          <div className="nav-search">
            <IconSearch/>
            <input placeholder="Search topics… e.g. budgeting, negotiation" value={query} onChange={e=>setQuery(e.target.value)} />
          </div>
          <div className="nav-links">
            {CATEGORIES.map(c=>(
              <button key={c.id} className={activeTopic && activeTopic.cat===c.id ? "active":""} onClick={()=>selectCategory(c)}>{c.label}</button>
            ))}
          </div>
        </div>
      </nav>

      <div className="shell">
        <Sidebar activeTopic={activeTopic} onSelect={selectTopic} onHome={goHome} query={query} setQuery={setQuery} mobileOpen={mobileOpen}/>
        {activeTopic ? <TopicPage topic={activeTopic}/> : <HomePage onSelectCategory={selectCategory}/>}
        <RightRail/>
        <footer>
          <b>Bearings</b> — general knowledge, shared freely. No accounts, no tracking logins, no fees.<br/>
          Educational content only, not professional advice. © {new Date().getFullYear()} Bearings.
        </footer>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
